name: Build ZiAr
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android signing
        shell: bash
        env:
          ZIAR_SIGNING_KEYSTORE_B64: ${{ secrets.ZIAR_SIGNING_KEYSTORE_B64 }}
          ZIAR_SIGNING_PASSWORD: ${{ secrets.ZIAR_SIGNING_PASSWORD }}
        run: |
          test -n "$ZIAR_SIGNING_KEYSTORE_B64" && test -n "$ZIAR_SIGNING_PASSWORD"
          printf '%s' "$ZIAR_SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ziar-android.p12"
          echo "ZIAR_SIGNING_STORE=$RUNNER_TEMP/ziar-android.p12" >> "$GITHUB_ENV"
      - run: gradle testDebugUnitTest assembleRelease
        working-directory: android
        env:
          ZIAR_SIGNING_PASSWORD: ${{ secrets.ZIAR_SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZiAr-Android
          path: android/app/build/outputs/apk/release/app-release.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: ZiAr-Windows
          path: dist/*
